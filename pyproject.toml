[project]
name = "vectorized-backtest"
version = "0.1.0"
description = "向量化多因子回测引擎: 因子面板 -> 信号 -> 仓位 -> 净值曲线, 全部收在一个包里, 用文件夹分工"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sources",
    "load",
    "momfactor",
    "loguru>=0.7.3",
]

[project.scripts]
vectorized-backtest = "vectorized_backtest:main"

[tool.uv.sources]
sources = { git = "https://github.com/20070316lbw-netizen/sources.git" }
load = { git = "https://github.com/20070316lbw-netizen/load.git" }
momfactor = { git = "https://github.com/20070316lbw-netizen/momfactor.git" }

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]
