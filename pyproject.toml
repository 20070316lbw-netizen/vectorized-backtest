[project]
name = "vectorized-backtest"
version = "0.1.0"
description = "向量化回测引擎: 给定调仓日的目标权重, 按买入持有的方式算组合净值; 仓位怎么算是 backtesttools 的事, 这里只管净值模拟"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "backtesttools",
    "loguru>=0.7.3",
]

[project.scripts]
vectorized-backtest = "vectorized_backtest:main"

[tool.uv.sources]
backtesttools = { git = "https://github.com/20070316lbw-netizen/backtesttools.git" }

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]
